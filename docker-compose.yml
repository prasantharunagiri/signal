version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: xauusd_postgres
    restart: always
    environment:
      POSTGRES_USER: xauusd_user
      POSTGRES_PASSWORD: xauusd_password
      POSTGRES_DB: xauusd_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: xauusd_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://xauusd_user:xauusd_password@db:5432/xauusd_db
      MARKET_DATA_PROVIDER: csv
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: xauusd_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
